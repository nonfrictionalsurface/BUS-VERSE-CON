# BusVerse + BusCon API - production stack
# Postgres 16 + Redis 7 + API (built from Dockerfile)
#
# DIFFERENCES from docker-compose.yml (dev):
#   - top-level name: busverse-prod (distinct volume namespace - no collision with dev)
#   - distinct container names (-prod suffix)
#   - host ports UNCHANGED (4310/7542/7543). Only ONE stack can run at a time on a host.
#   - api service is built + depends on postgres/redis healthchecks
#
# Usage:
#   1. Copy-Item .env.production.template .env.production; fill every REPLACE_*
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. Once: docker compose -f docker-compose.prod.yml exec api npx prisma migrate deploy
#   4. Once: docker compose -f docker-compose.prod.yml exec api pnpm db:seed
#   5. Verify: docker compose -f docker-compose.prod.yml exec api pnpm db:verify

name: busverse-prod

services:
  postgres:
    image: postgres:16
    container_name: busverse-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-busverse}
      TZ: UTC
    ports:
      - "7542:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-busverse}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: busverse-redis-prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "7543:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: busverse-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "4310"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-busverse}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "4310:4310"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4310/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  pg_data:
  redis_data: