version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: busverse-postgres
    restart: unless-stopped
    ports:
      - "7542:5432"
    environment:
      POSTGRES_DB: busverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d busverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: busverse-redis
    restart: unless-stopped
    ports:
      - "7543:6379"
    command: redis-server --requirepass redis_dev_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data: